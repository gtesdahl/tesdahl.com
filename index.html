<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>tesdahl.com</title>
    <meta name="description" content="tesdahl.com" />
    <meta property="og:title" content="tesdahl.com" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tesdahl.com/" />
    <meta property="og:image" content="https://tesdahl.com/photo.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://tesdahl.com/photo.jpg" />
    <link rel="icon" href="/photo.jpg" type="image/jpeg" />
    <link rel="preload" href="/photo.jpg" as="image" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        background: #000;
      }

      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        height: 100dvh;
        max-width: 100vw;
        max-height: 100dvh;
        overflow: hidden;
      }

      img {
        display: block;
        max-width: 100%;
        max-height: 100%;
        max-height: 100dvh;
        width: auto;
        height: auto;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/photo.jpg"
        alt=""
        width="3024"
        height="2268"
        decoding="async"
        fetchpriority="high"
      />
    </main>
  </body>
</html>
